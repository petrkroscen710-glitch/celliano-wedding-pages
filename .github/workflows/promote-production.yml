name: Promote tested site to production branch

on:
  workflow_run:
    workflows: ["Quality check"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: celliano-production-promotion
  cancel-in-progress: true

jobs:
  promote:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production package
        run: node tools/build-production.mjs
      - name: Verify production package
        run: node tools/verify-production-output.mjs _production
      - name: Verify PHP syntax
        run: php -l _production/api/poptavka.php
      - name: Publish production branch
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cp -a _production /tmp/celliano-production
          rm -rf _production
          git fetch origin production
          git checkout -B production origin/production
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/celliano-production/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Production already matches tested main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy tested Celliano site from ${SOURCE_SHA}"
          git push origin production
