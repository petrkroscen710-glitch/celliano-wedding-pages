name: Import live image assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-live-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download the two local Celliano assets from the current live site
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --output assets/celliano-home-duo-cutout.webp             https://celliano.cz/assets/celliano-home-duo-cutout.webp
          curl --fail --location --retry 3 --output assets/celliano-duo-wedding-cutout.png             https://celliano.cz/assets/celliano-duo-wedding-cutout.png
          test "$(stat -c%s assets/celliano-home-duo-cutout.webp)" -gt 100000
          test "$(stat -c%s assets/celliano-duo-wedding-cutout.png)" -gt 1000000
          file assets/celliano-home-duo-cutout.webp
          file assets/celliano-duo-wedding-cutout.png
      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Assets already current."
            exit 0
          fi
          git commit -m "Import Celliano image assets from live site"
          git push
